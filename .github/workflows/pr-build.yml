name: Build Veilbound PR

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Reconstruct, validate, build, and smoke-test Veilbound 0.1.51
        shell: bash
        run: bash ci/run-0151-chunked.sh

      - name: Upload validated 0.1.51 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.51-dev-final
          path: |
            Veilbound-0.1.51-dev.jar
            Veilbound-0.1.51-dev-SHA256SUMS.txt
            Veilbound-0.1.51-dev-server-smoke.log
          if-no-files-found: error
          retention-days: 30
