name: Build Veilbound PR

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Set up texture build dependency
        shell: bash
        run: python3 -m pip install --user pillow

      - name: Reconstruct, validate, build, and smoke-test Veilbound 0.1.52
        shell: bash
        run: |
          set -euo pipefail
          cat ci-0152/buildfixpart-*.b64 | base64 --decode > build-0152.sh.xz
          echo "4aa5e29b5a8ff5d606f0dc20fd3483a0423bf233ee314d5c31077789bf9fbc06  build-0152.sh.xz" | sha256sum -c -
          xz -dc build-0152.sh.xz > build-0152.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-0152.sh')
          s = p.read_text(encoding='utf-8')
          needle = 'python3 texture-pass-0152.py\n'
          insert = '''mkdir -p "$ROOT/.vanilla"\nprintf '%s' 'iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAAAAAA6mKC9AAAAXklEQVR42gXBMQEAMAwEocqNgNuR8JYLb9uUruCRgLv0dFddBR6bsaF6Ucm2xTNAXddebGur4NVdV1R424xtoMewjW3zTuouUT2wgc2eyhR3XW9TVFR7CsC2PaBsxAdyLn2NNWHIVAAAAABJRU5ErkJggg==' | base64 --decode > "$ROOT/.vanilla/stone.png"\nprintf '%s' 'iVBORw0KGgoAAAANSUhEUgAAABAAAAAQBAMAAADt3eJSAAAAD1BMVEVkZGR5eXlRUVE9PUMvLzdi5EnwAAAAYUlEQVR42gXBAQHEIAwEweUUgIM0qYHPoaDgX9PPMDONKqlrR7pg6r1nm1Y5FuKkm0GxIj8ig6nX6dvIHtRJqvxIbnwzsvdB6tonF9RYVT2RH+QG74861yxq/xSDJb0PyR+e6w/hsG/r7QAAAABJRU5ErkJggg==' | base64 --decode > "$ROOT/.vanilla/deepslate.png"\n'''
          if needle not in s:
              raise SystemExit('texture generator call not found')
          p.write_text(s.replace(needle, insert + needle, 1), encoding='utf-8')
          PY
          bash build-0152.sh

      - name: Upload validated 0.1.52 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.52-dev-final
          path: |
            Veilbound-0.1.52-dev.jar
            Veilbound-0.1.52-dev-SHA256SUMS.txt
            Veilbound-0.1.52-dev-server-smoke.log
          if-no-files-found: error
          retention-days: 30
