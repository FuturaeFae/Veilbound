name: Build Veilbound PR

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Reconstruct, validate, build, and smoke-test Veilbound 0.1.52
        shell: bash
        run: |
          set -euo pipefail
          cat ci-0152/buildpart-*.b64 | base64 --decode > build-0152.sh.xz
          echo "d187b95648bb7fae8552686b30f38818d454e21dc52ed68d56a106319495a695  build-0152.sh.xz" | sha256sum -c -
          xz -dc build-0152.sh.xz > build-0152.sh
          bash build-0152.sh

      - name: Upload validated 0.1.52 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.52-dev-final
          path: |
            Veilbound-0.1.52-dev.jar
            Veilbound-0.1.52-dev-SHA256SUMS.txt
            Veilbound-0.1.52-dev-server-smoke.log
          if-no-files-found: error
          retention-days: 30
