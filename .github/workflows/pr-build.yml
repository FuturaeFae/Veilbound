name: Build Veilbound PR

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and extract audited 0.1.37 compiler baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Veilbound-compile-input.tar.xz)" = "90b3f010f18737a030825766844cbc91f8abb926"
          tar -xJf Veilbound-compile-input.tar.xz
          test -f Veilbound-0.1.37-dev-source/build.gradle
          test -d Veilbound-0.1.37-dev-source/src/main/java

      - name: Reconstruct and apply 0.1.48 compile overlay
        shell: bash
        run: |
          set -euo pipefail
          cat ci-0148/part-*.b64 | base64 --decode > Veilbound-0.1.48-compile-overlay.tar.xz
          echo "f314493cd063871026ce4d0907a8f582d43f09942db355065f551acd8199e710  Veilbound-0.1.48-compile-overlay.tar.xz" | sha256sum -c -
          tar -xJf Veilbound-0.1.48-compile-overlay.tar.xz -C Veilbound-0.1.37-dev-source
          grep -q '^mod_version=0.1.48-dev$' Veilbound-0.1.37-dev-source/gradle.properties
          test -f Veilbound-0.1.37-dev-source/src/main/java/dev/futurae/veilbound/client/render/armor/VeilboundArmorModels.java

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile and run Veilbound checks against NeoForge 26.2
        working-directory: Veilbound-0.1.37-dev-source
        run: gradle --no-daemon --stacktrace build

      - name: Collect compiled JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find Veilbound-0.1.37-dev-source/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$JAR"
          cp "$JAR" Veilbound-0.1.48-dev-compiled.jar
          unzip -t Veilbound-0.1.48-dev-compiled.jar
          sha256sum Veilbound-0.1.48-dev-compiled.jar > Veilbound-0.1.48-dev-compiled-SHA256SUMS.txt

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.48-dev-compiled
          path: |
            Veilbound-0.1.48-dev-compiled.jar
            Veilbound-0.1.48-dev-compiled-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
