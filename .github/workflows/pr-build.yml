name: Build Veilbound PR

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and extract audited source ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "e36b2721698d091b4a375b553b22be1f80ad22cc8b0242e40f399ea0ad81eab3  Veilbound-0.1.37-dev-source.zip" | sha256sum -c -
          unzip -q Veilbound-0.1.37-dev-source.zip
          test -f Veilbound-0.1.37-dev-source/build.gradle
          test -f Veilbound-0.1.37-dev-source/gradle.properties
          test -f Veilbound-0.1.37-dev-source/settings.gradle
          test -d Veilbound-0.1.37-dev-source/src/main/java
          test -d Veilbound-0.1.37-dev-source/src/main/resources

      - name: Apply Minecraft 26.2 compatibility fixes
        run: python3 ci/apply-26.2-compat.py Veilbound-0.1.37-dev-source

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Build against NeoForge 26.2
        working-directory: Veilbound-0.1.37-dev-source
        run: gradle --no-daemon --stacktrace build

      - name: Collect test JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find Veilbound-0.1.37-dev-source/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$JAR"
          cp "$JAR" Veilbound-0.1.37-dev.jar
          unzip -t Veilbound-0.1.37-dev.jar
          sha256sum Veilbound-0.1.37-dev.jar > Veilbound-0.1.37-dev-SHA256SUMS.txt

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.37-dev-test-build
          path: |
            Veilbound-0.1.37-dev.jar
            Veilbound-0.1.37-dev-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
