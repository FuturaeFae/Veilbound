name: Build Veilbound

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and extract audited compiler input
        shell: bash
        run: |
          set -euo pipefail
          echo "e17a50020daa19800cb0362630564abd525dedbeb7c1974f9108ebacd25c82f1  Veilbound-compile-input.tar.xz" | sha256sum -c -
          tar -xJf Veilbound-compile-input.tar.xz
          test -f Veilbound-0.1.37-dev-source/build.gradle
          test -f Veilbound-0.1.37-dev-source/gradle.properties
          test -d Veilbound-0.1.37-dev-source/src/main/java

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Compile against NeoForge 26.2
        working-directory: Veilbound-0.1.37-dev-source
        run: gradle --no-daemon --stacktrace classes jar

      - name: Collect compiled JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find Veilbound-0.1.37-dev-source/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$JAR"
          cp "$JAR" Veilbound-0.1.37-dev-compiled.jar
          unzip -t Veilbound-0.1.37-dev-compiled.jar
          sha256sum Veilbound-0.1.37-dev-compiled.jar > Veilbound-0.1.37-dev-compiled-SHA256SUMS.txt

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.37-dev-compiled
          path: |
            Veilbound-0.1.37-dev-compiled.jar
            Veilbound-0.1.37-dev-compiled-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
