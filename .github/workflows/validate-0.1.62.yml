name: Validate Veilbound 0.1.62

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-0162:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Download exact 0.1.61 source baseline
        uses: actions/download-artifact@v4
        with:
          name: Veilbound-0.1.61-dev-final
          path: baseline-0161
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34104147532

      - name: Reconstruct 0.1.62 adaptive fog and cloud pass
        shell: bash
        run: |
          set -euo pipefail
          echo "926e60b19d37e2504cac464122c3a01e5595b69b6e3ee02a424b335c7cb792ee  baseline-0161/Veilbound-0.1.61-dev-source.tar.xz" | sha256sum -c -
          test -s ci-0162/apply-0162.py
          test -s ci-0162/overlay-0162.tar.xz
          mkdir -p source-0162
          tar -xJf baseline-0161/Veilbound-0.1.61-dev-source.tar.xz -C source-0162
          python3 ci-0162/apply-0162.py source-0162
          grep -q '^mod_version=0.1.62-dev$' source-0162/gradle.properties

      - name: Audit 0.1.62 source and retained resources
        shell: bash
        run: |
          set -euo pipefail
          RENDERER=source-0162/src/main/java/dev/futurae/veilbound/client/render/VeilBoundaryRenderer.java
          CLOUDS=source-0162/src/main/java/dev/futurae/veilbound/client/render/NoCloudsRenderer.java
          CLIENT=source-0162/src/main/java/dev/futurae/veilbound/client/VeilboundClient.java
          SHADER=source-0162/src/main/resources/assets/veilbound/shaders/core/veil_boundary_fog.fsh
          DOMAIN=source-0162/src/main/resources/data/veilbound/dimension_type/domain.json
          DYNAMO=source-0162/src/main/java/dev/futurae/veilbound/block/entity/BoundaryDynamoBlockEntity.java
          grep -q 'smartFogDepth' "$RENDERER"
          grep -q 'MAX_AXIS_FOG_FRACTION = 0.34D' "$RENDERER"
          grep -q 'MAX_FOG_DEPTH = 6.00D' "$RENDERER"
          grep -q 'MAX_BOUNDARY_RENDER_DISTANCE = 224.0D' "$RENDERER"
          grep -q 'visibleQuadX' "$RENDERER"
          grep -q 'eddyStrength' "$RENDERER"
          grep -q 'implements CustomCloudsRenderer' "$CLOUDS"
          grep -q 'return true;' "$CLOUDS"
          grep -q 'registerCloudRenderer' "$CLIENT"
          grep -q 'spunWarp' "$SHADER"
          grep -q 'field += eddy' "$SHADER"
          grep -q 'FE_CAPACITY = 500_000' "$DYNAMO"
          grep -q 'CHARGE_SLOT = 1' "$DYNAMO"
          python3 - <<'PY'
          from pathlib import Path
          import json, struct
          root = Path('source-0162/src/main/resources')
          for path in list(root.rglob('*.json')) + list(root.rglob('*.mcmeta')):
              json.loads(path.read_text(encoding='utf-8'))
          domain = json.loads((root / 'data/veilbound/dimension_type/domain.json').read_text())
          assert domain['attributes']['neoforge:custom_clouds'] == 'veilbound:no_clouds'
          assert domain['attributes']['minecraft:visual/cloud_color'].startswith('#00')
          assert domain['attributes']['minecraft:visual/cloud_height'] >= 4096
          ores = sorted((root / 'assets/veilbound/textures/block').glob('*ore.png'))
          assert len(ores) == 12, len(ores)
          for path in ores:
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II', data[16:24]) == (16, 128), (path, struct.unpack('>II', data[16:24]))
          recipes = list((root / 'data/veilbound/veilbound/engineering_recipes').glob('*.json'))
          assert len(recipes) == 120, len(recipes)
          assert (root / 'data/veilbound/recipe/boundary_dynamo.json').is_file()
          print('VEILBOUND_0162_RESOURCE_AUDIT=PASS ores=12 engineering_recipes=120 clouds=disabled')
          PY
          echo VEILBOUND_0162_SOURCE_AUDIT=PASS

      - name: Package 0.1.62 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -C source-0162 -cJf Veilbound-0.1.62-dev-source.tar.xz --exclude='./build' --exclude='./.gradle' --exclude='./.vanilla' --exclude='./run' .
          test -s Veilbound-0.1.62-dev-source.tar.xz

      - name: Java 25 Gradle build and packaged JAR audit
        shell: bash
        run: |
          exec > >(tee "$GITHUB_WORKSPACE/03-gradle-build-0162.log") 2>&1
          set -euo pipefail
          cd source-0162
          gradle --no-daemon --stacktrace clean check jar
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$GITHUB_WORKSPACE/Veilbound-0.1.62-dev.jar"
          cd "$GITHUB_WORKSPACE"
          unzip -t Veilbound-0.1.62-dev.jar
          unzip -Z1 Veilbound-0.1.62-dev.jar | grep -q 'dev/futurae/veilbound/client/render/NoCloudsRenderer.class'
          unzip -Z1 Veilbound-0.1.62-dev.jar | grep -q 'dev/futurae/veilbound/client/render/VeilBoundaryRenderer.class'
          unzip -Z1 Veilbound-0.1.62-dev.jar | grep -q 'dev/futurae/veilbound/block/entity/BoundaryDynamoBlockEntity.class'
          unzip -Z1 Veilbound-0.1.62-dev.jar | grep -q 'assets/veilbound/shaders/core/veil_boundary_fog.fsh'
          unzip -Z1 Veilbound-0.1.62-dev.jar | grep -q 'data/veilbound/recipe/boundary_dynamo.json'
          RECIPES="$(unzip -Z1 Veilbound-0.1.62-dev.jar | grep -c '^data/veilbound/veilbound/engineering_recipes/.*\.json$')"
          ORES="$(unzip -Z1 Veilbound-0.1.62-dev.jar | grep -c '^assets/veilbound/textures/block/.*ore\.png$')"
          test "$RECIPES" -eq 120
          test "$ORES" -eq 12
          echo "VEILBOUND_0162_JAR_AUDIT=PASS engineering_recipes=$RECIPES ore_sheets=$ORES adaptive_fog=present clouds=disabled boundary_dynamo=retained" | tee Veilbound-0.1.62-dev-audit.txt

      - name: Exact-JAR NeoForge 26.2.0.75 server smoke
        shell: bash
        run: |
          exec > >(tee "$GITHUB_WORKSPACE/04-server-setup-0162.log") 2>&1
          set -euo pipefail
          SERVER="$GITHUB_WORKSPACE/server-0162"
          LOG="$GITHUB_WORKSPACE/Veilbound-0.1.62-dev-server-smoke.log"
          mkdir -p "$SERVER/mods"
          cd "$SERVER"
          curl -fsSL -o neoforge-installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/26.2.0.75/neoforge-26.2.0.75-installer.jar
          java -jar neoforge-installer.jar --installServer
          echo 'eula=true' > eula.txt
          printf 'online-mode=false\nserver-port=25565\nmotd=Veilbound 0.1.62 CI smoke\n' > server.properties
          cp "$GITHUB_WORKSPACE/Veilbound-0.1.62-dev.jar" mods/
          setsid bash run.sh nogui > "$LOG" 2>&1 &
          SERVER_PID=$!
          SMOKE_OK=0
          for _ in $(seq 1 180); do
            if grep -Eq 'Done \([0-9.]+s\)!' "$LOG"; then SMOKE_OK=1; break; fi
            if grep -Eq 'ModLoadingException|Exception in thread "main"|Crash report|Failed to start the minecraft server|Encountered an unexpected exception' "$LOG"; then break; fi
            sleep 1
          done
          kill -TERM -- -"$SERVER_PID" 2>/dev/null || true
          sleep 2
          kill -KILL -- -"$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          if [ "$SMOKE_OK" -ne 1 ]; then tail -n 200 "$LOG" || true; exit 1; fi
          grep -E 'Done \([0-9.]+s\)!' "$LOG"
          echo VEILBOUND_0162_SERVER_SMOKE=PASS
          cd "$GITHUB_WORKSPACE"
          sha256sum Veilbound-0.1.62-dev.jar Veilbound-0.1.62-dev-source.tar.xz Veilbound-0.1.62-dev-server-smoke.log > Veilbound-0.1.62-dev-SHA256SUMS.txt

      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.62-dev-diagnostics
          path: |
            03-gradle-build-0162.log
            04-server-setup-0162.log
            Veilbound-0.1.62-dev.jar
            Veilbound-0.1.62-dev-source.tar.xz
            Veilbound-0.1.62-dev-audit.txt
            Veilbound-0.1.62-dev-SHA256SUMS.txt
            Veilbound-0.1.62-dev-server-smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload validated final artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.62-dev-final
          path: |
            Veilbound-0.1.62-dev.jar
            Veilbound-0.1.62-dev-source.tar.xz
            Veilbound-0.1.62-dev-audit.txt
            Veilbound-0.1.62-dev-SHA256SUMS.txt
            Veilbound-0.1.62-dev-server-smoke.log
          if-no-files-found: error
          retention-days: 30
