name: Validate Veilbound 0.1.68

on:
  push:
    branches:
      - dev/veilbound-0.1.48-armor-models
    paths:
      - 'ci-0167/**'
      - '.github/workflows/validate-0.1.68.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-0168:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Download exact validated 0.1.66 source baseline
        uses: actions/download-artifact@v4
        with:
          name: Veilbound-0.1.66-dev-final
          path: baseline-0166
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34188257046

      - name: Reconstruct validated 0.1.67 baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "97abce24b35946a28749fde62f9e23e0bfd5d96e9d162dcb612657bbfca2ce1a  baseline-0166/Veilbound-0.1.66-dev-source.tar.xz" | sha256sum -c -
          mkdir -p source-0168
          tar -xJf baseline-0166/Veilbound-0.1.66-dev-source.tar.xz -C source-0168
          python3 ci-0167/apply-0167.py source-0168
          grep -q '^mod_version=0.1.67-dev$' source-0168/gradle.properties

      - name: Apply recovered full 0.1.68 refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 ci-0167/run-full-refinement-0168.py source-0168 | tee 01-refinement-0168.log
          grep -q '^mod_version=0.1.68-dev$' source-0168/gradle.properties
          grep -q 'VEILBOUND_0168_RECOVERY_PATCH=PASS' 01-refinement-0168.log
          grep -q 'VEILBOUND_0168_FULL_AUDIT=PASS' 01-refinement-0168.log
          grep -q 'VEILBOUND_0168_RESOURCE_AUDIT=PASS' 01-refinement-0168.log
          grep -q 'VEILBOUND_0168_RECONSTRUCTION=PASS' 01-refinement-0168.log

      - name: Audit refinement source and resources
        shell: bash
        run: |
          set -euo pipefail
          ROOT=source-0168
          test ! -e "$ROOT/src/main/resources/assets/veilbound/textures/block/boundary_dynamo.png"
          test ! -e "$ROOT/src/main/resources/assets/veilbound/textures/block/void_anchor.png"
          test -s "$ROOT/src/main/resources/assets/veilbound/textures/block/dynamo_front.png"
          test -s "$ROOT/src/main/resources/assets/veilbound/textures/block/void_anchor_top.png"
          grep -q 'draggingScrollBar' "$ROOT/src/main/java/dev/futurae/veilbound/client/screen/VeilInventoryScreen.java"
          grep -q 'handleCraftFilterClick' "$ROOT/src/main/java/dev/futurae/veilbound/client/screen/VeilInventoryScreen.java"
          grep -q 'BoundaryDynamoBlockEntity.FE_CAPACITY' "$ROOT/src/main/java/dev/futurae/veilbound/client/screen/BoundaryDynamoScreen.java"
          grep -q 'ParticleTypes.REVERSE_PORTAL' "$ROOT/src/main/java/dev/futurae/veilbound/block/VoidAnchorBlock.java"
          echo VEILBOUND_0168_STATIC_AUDIT=PASS

      - name: Package 0.1.68 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -C source-0168 -cJf Veilbound-0.1.68-dev-source.tar.xz --exclude='./build' --exclude='./.gradle' --exclude='./run' .
          test -s Veilbound-0.1.68-dev-source.tar.xz

      - name: Java 25 Gradle build and packaged JAR audit
        shell: bash
        run: |
          exec > >(tee "$GITHUB_WORKSPACE/03-gradle-build-0168.log") 2>&1
          set -euo pipefail
          cd source-0168
          gradle --no-daemon --stacktrace clean check jar
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$GITHUB_WORKSPACE/Veilbound-0.1.68-dev.jar"
          cd "$GITHUB_WORKSPACE"
          unzip -t Veilbound-0.1.68-dev.jar
          for entry in \
            dev/futurae/veilbound/client/screen/VeilInventoryScreen.class \
            dev/futurae/veilbound/client/screen/DimensionalTransducerScreen.class \
            dev/futurae/veilbound/client/screen/BoundaryDynamoScreen.class \
            dev/futurae/veilbound/block/VoidAnchorBlock.class \
            assets/veilbound/textures/block/dynamo_front.png \
            assets/veilbound/textures/block/void_anchor_top.png \
            assets/veilbound/models/block/dimensional_transducer.json; do
              unzip -Z1 Veilbound-0.1.68-dev.jar | grep -q "$entry"
          done
          ! unzip -Z1 Veilbound-0.1.68-dev.jar | grep -q '^assets/veilbound/textures/block/boundary_dynamo.png$'
          ! unzip -Z1 Veilbound-0.1.68-dev.jar | grep -q '^assets/veilbound/textures/block/void_anchor.png$'
          echo 'VEILBOUND_0168_JAR_AUDIT=PASS' | tee Veilbound-0.1.68-dev-audit.txt

      - name: Exact-JAR NeoForge 26.2.0.75 server smoke
        shell: bash
        run: |
          exec > >(tee "$GITHUB_WORKSPACE/04-server-setup-0168.log") 2>&1
          set -euo pipefail
          SERVER="$GITHUB_WORKSPACE/server-0168"
          LOG="$GITHUB_WORKSPACE/Veilbound-0.1.68-dev-server-smoke.log"
          mkdir -p "$SERVER/mods"
          cd "$SERVER"
          curl -fsSL -o neoforge-installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/26.2.0.75/neoforge-26.2.0.75-installer.jar
          java -jar neoforge-installer.jar --installServer
          echo 'eula=true' > eula.txt
          printf 'online-mode=false\nserver-port=25565\nmotd=Veilbound 0.1.68 CI smoke\n' > server.properties
          cp "$GITHUB_WORKSPACE/Veilbound-0.1.68-dev.jar" mods/
          setsid bash run.sh nogui > "$LOG" 2>&1 &
          SERVER_PID=$!
          SMOKE_OK=0
          for _ in $(seq 1 180); do
            if grep -Eq 'Done \([0-9.]+s\)!' "$LOG"; then SMOKE_OK=1; break; fi
            if grep -Eq 'ModLoadingException|Exception in thread "main"|Crash report|Failed to start the minecraft server|Encountered an unexpected exception' "$LOG"; then break; fi
            sleep 1
          done
          kill -TERM -- -"$SERVER_PID" 2>/dev/null || true
          sleep 2
          kill -KILL -- -"$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          if [ "$SMOKE_OK" -ne 1 ]; then tail -n 250 "$LOG" || true; exit 1; fi
          grep -E 'Done \([0-9.]+s\)!' "$LOG"
          echo VEILBOUND_0168_SERVER_SMOKE=PASS
          cd "$GITHUB_WORKSPACE"
          sha256sum Veilbound-0.1.68-dev.jar Veilbound-0.1.68-dev-source.tar.xz Veilbound-0.1.68-dev-server-smoke.log > Veilbound-0.1.68-dev-SHA256SUMS.txt

      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.68-dev-diagnostics
          path: |
            01-refinement-0168.log
            03-gradle-build-0168.log
            04-server-setup-0168.log
            Veilbound-0.1.68-dev.jar
            Veilbound-0.1.68-dev-source.tar.xz
            Veilbound-0.1.68-dev-audit.txt
            Veilbound-0.1.68-dev-SHA256SUMS.txt
            Veilbound-0.1.68-dev-server-smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload validated final artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.68-dev-final
          path: |
            Veilbound-0.1.68-dev.jar
            Veilbound-0.1.68-dev-source.tar.xz
            Veilbound-0.1.68-dev-audit.txt
            Veilbound-0.1.68-dev-SHA256SUMS.txt
            Veilbound-0.1.68-dev-server-smoke.log
          if-no-files-found: error
          retention-days: 30
