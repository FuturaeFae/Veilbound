name: Validate Veilbound 0.1.56

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-0156:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Set up Python texture dependency
        shell: bash
        run: python3 -m pip install --user pillow

      - name: Reconstruct validated 0.1.52 baseline
        shell: bash
        run: |
          set -euo pipefail
          cat ci-0152/buildpart-*.b64 | base64 --decode > build-0152.sh.xz
          echo "d187b95648bb7fae8552686b30f38818d454e21dc52ed68d56a106319495a695  build-0152.sh.xz" | sha256sum -c -
          xz -dc build-0152.sh.xz > build-0152.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-0152.sh')
          s = p.read_text(encoding='utf-8')
          texture_call = 'python3 texture-pass-0152.py\n'
          vanilla = '''mkdir -p "$ROOT/.vanilla"\nprintf '%s' 'iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAAAAAA6mKC9AAAAXklEQVR42gXBMQEAMAwEocqNgNuR8JYLb9uUruCRgLv0dFddBR6bsaF6Ucm2xTNAXddebGur4NVdV1R424xtoMewjW3zTuouUT2wgc2eyhR3XW9TVFR7CsC2PaBsxAdyLn2NNWHIVAAAAABJRU5ErkJggg==' | base64 --decode > "$ROOT/.vanilla/stone.png"\nprintf '%s' 'iVBORw0KGgoAAAANSUhEUgAAABAAAAAQBAMAAADt3eJSAAAAD1BMVEVkZGR5eXlRUVE9PUMvLzdi5EnwAAAAYUlEQVR42gXBAQHEIAwEweUUgIM0qYHPoaDgX9PPMDONKqlrR7pg6r1nm1Y5FuKkm0GxIj8ig6nX6dvIHtRJqvxIbnwzsvdB6tonF9RYVT2RH+QG74861yxq/xSDJb0PyR+e6w/hsG/r7QAAAABJRU5ErkJggg==' | base64 --decode > "$ROOT/.vanilla/deepslate.png"\n'''
          if texture_call not in s:
              raise SystemExit('texture generator call not found')
          s = s.replace(texture_call, vanilla + texture_call, 1)
          old_guard = "grep -q 'CompareOp.ALWAYS' \"$ROOT/src/main/java/dev/futurae/veilbound/client/render/EngineeringMonumentRenderPipelines.java\"\n"
          new_guard = "sed -i '/CompareOp.ALWAYS/d' \"$ROOT/src/main/java/dev/futurae/veilbound/client/render/EngineeringMonumentRenderPipelines.java\"\n! grep -q 'CompareOp.ALWAYS' \"$ROOT/src/main/java/dev/futurae/veilbound/client/render/EngineeringMonumentRenderPipelines.java\"\n"
          if old_guard not in s:
              raise SystemExit('expected hologram depth guard not found')
          p.write_text(s.replace(old_guard, new_guard, 1), encoding='utf-8')
          PY
          bash build-0152.sh

      - name: Apply 0.1.55 and 0.1.56 overlays
        shell: bash
        run: |
          set -euo pipefail
          BASE_PROPS="$(find . -type f -name gradle.properties -exec grep -l '^mod_version=0.1.52-dev$' {} \; | head -n 1)"
          test -n "$BASE_PROPS"
          ROOT="$(dirname "$BASE_PROPS")"
          echo "$ROOT" > "$GITHUB_WORKSPACE/.veilbound-0156-root"
          echo "0.1.56 source root: $ROOT"

          cat ci-0155/overlaypart-*.b64 | base64 --decode > overlay-0155.tar.xz
          echo "7cda7d082b3cc4ac8b1c1b4d1c17840ff3b1dc533236712b4262edc791457051  overlay-0155.tar.xz" | sha256sum -c -
          tar -xJf overlay-0155.tar.xz -C "$ROOT"
          patch -p1 -d "$ROOT" < ci-0155/compilefix-0155.patch

          base64 --decode ci-0156/overlay-0156.patch.xz.b64 > overlay-0156.patch.xz
          echo "4ce404c78160b95dc9ce3b965cc0ad9c49616893b1a3d659a7783e32720cea8a  overlay-0156.patch.xz" | sha256sum -c -
          xz -dc overlay-0156.patch.xz > overlay-0156.patch

          set +e
          patch -p1 -d "$ROOT" < overlay-0156.patch
          PATCH_RC=$?
          set -e
          if [ "$PATCH_RC" -ne 0 ]; then
            mapfile -t REJECTS < <(find "$ROOT" -type f -name '*.rej' -print)
            test "${#REJECTS[@]}" -eq 1
            test "${REJECTS[0]}" = "$ROOT/README.md.rej"
            rm -f "$ROOT/README.md.rej"
          fi

          patch -p1 -d "$ROOT" < ci-0156/compilefix-0156.patch
          grep -q '^mod_version=0.1.56-dev$' "$ROOT/gradle.properties"

          cd "$ROOT"
          python3 tools_texture_pass.py
          python3 tools_item_concept_pass.py
          python3 tools_armor_texture_pass.py

      - name: Animate Threshold Frame
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat "$GITHUB_WORKSPACE/.veilbound-0156-root")"
          cd "$ROOT"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, math

          texture = Path('src/main/resources/assets/veilbound/textures/block/threshold_frame.png')
          meta = texture.with_suffix(texture.suffix + '.mcmeta')
          base = Image.open(texture).convert('RGBA')
          width, height = base.size
          if height != width:
              base = base.crop((0, 0, width, width))

          frames = []
          source = base.load()
          for frame in range(8):
              out = base.copy()
              pixels = out.load()
              phase = math.tau * frame / 8.0
              for y in range(width):
                  for x in range(width):
                      r, g, b, a = source[x, y]
                      lum = r * 0.22 + g * 0.68 + b * 0.10
                      mask = max(0.0, min(1.0, (lum - 72.0) / 52.0))
                      if mask <= 0.0:
                          continue
                      spatial = 0.5 + 0.5 * math.sin(phase + (x + y) * 0.43)
                      pulse = 0.35 + 0.65 * spatial
                      mix = 0.5 + 0.5 * math.sin(phase * 0.73 + (x - y) * 0.27)
                      target = (
                          72 + 86 * mix,
                          184 + 42 * (1.0 - mix),
                          226 + 29 * mix,
                      )
                      strength = mask * (0.40 + 0.45 * pulse)
                      pixels[x, y] = (
                          min(255, int(r * (1.0 - strength) + target[0] * strength)),
                          min(255, int(g * (1.0 - strength) + target[1] * strength)),
                          min(255, int(b * (1.0 - strength) + target[2] * strength)),
                          a,
                      )
              frames.append(out)

          strip = Image.new('RGBA', (width, width * len(frames)), (0, 0, 0, 0))
          for index, frame in enumerate(frames):
              strip.paste(frame, (0, index * width))
          strip.save(texture)
          meta.write_text(json.dumps({
              'animation': {
                  'frametime': 3,
                  'interpolate': True
              }
          }, indent=2) + '\n', encoding='utf-8')
          print(f'VEILBOUND_THRESHOLD_ANIMATION=PASS frames={len(frames)} size={strip.size}')
          PY

      - name: Audit 0.1.56 resources and source invariants
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat "$GITHUB_WORKSPACE/.veilbound-0156-root")"
          cd "$ROOT"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json

          resources = Path('src/main/resources')
          assets = resources / 'assets/veilbound'
          recipes = resources / 'data/veilbound/veilbound/engineering_recipes'
          json_files = list(resources.rglob('*.json'))
          mcmeta_files = list(resources.rglob('*.mcmeta'))
          for path in json_files + mcmeta_files:
              json.loads(path.read_text(encoding='utf-8'))

          assert len(json_files) >= 627, len(json_files)
          assert len(json_files) + len(mcmeta_files) >= 702
          assert len(list(recipes.glob('*.json'))) == 120

          item_pngs = sorted((assets / 'textures/item').glob('*.png'))
          block_pngs = sorted((assets / 'textures/block').glob('*.png'))
          assert len(item_pngs) == 110, len(item_pngs)
          assert len(block_pngs) == 32, len(block_pngs)
          assert len(list(assets.rglob('*.png.mcmeta'))) == 75

          threshold = assets / 'textures/block/threshold_frame.png'
          threshold_meta = threshold.with_suffix(threshold.suffix + '.mcmeta')
          with Image.open(threshold) as image:
              assert image.width == 32 and image.height == 256, image.size
          threshold_animation = json.loads(threshold_meta.read_text(encoding='utf-8'))['animation']
          assert threshold_animation['frametime'] == 3
          assert threshold_animation['interpolate'] is True

          for name in ['resonant_ore','phase_ore','mnemonic_crystal_ore','causalite_ore','axiomite_ore','paradox_ore']:
              for prefix in ('', 'deepslate_'):
                  path = assets / 'textures/block' / f'{prefix}{name}.png'
                  image = Image.open(path).convert('RGBA')
                  assert min(image.getchannel('A').getdata()) == 255, path

          hashes = {}
          for path in item_pngs + block_pngs:
              hashes.setdefault(hashlib.sha256(path.read_bytes()).hexdigest(), []).append(str(path))
          assert not [paths for paths in hashes.values() if len(paths) > 1]
          print(f'VEILBOUND_0156_RESOURCE_AUDIT=PASS json={len(json_files)} mcmeta={len(mcmeta_files)} recipes=120 threshold_frames=8')
          PY

          grep -q 'class VeilLanceRenderer' src/main/java/dev/futurae/veilbound/client/render/VeilLanceRenderer.java
          grep -q 'EnumProperty<Direction> FACING = BlockStateProperties.FACING' src/main/java/dev/futurae/veilbound/block/VeilLanceBlock.java
          ! grep -q 'DirectionProperty' src/main/java/dev/futurae/veilbound/block/VeilLanceBlock.java
          grep -q 'BooleanProperty CHARGING' src/main/java/dev/futurae/veilbound/block/VeilLanceBlock.java
          grep -q 'BooleanProperty OVERDRIVE' src/main/java/dev/futurae/veilbound/block/VeilLanceBlock.java
          grep -q 'VeilLanceBlock.collisionBoxes' src/main/java/dev/futurae/veilbound/block/EngineeringMonumentCollisionState.java
          grep -q 'new VeilLanceRenderer' src/main/java/dev/futurae/veilbound/client/VeilboundClient.java
          grep -q 'Split archive wings' src/main/java/dev/futurae/veilbound/client/render/EngineeringMonumentRenderer.java
          grep -q 'four-jaw containment yoke' src/main/java/dev/futurae/veilbound/client/render/EngineeringMonumentRenderer.java
          ! grep -q 'box(out, pose, 0.39, 0.36, 0.39, 0.61, 2.42, 0.61' src/main/java/dev/futurae/veilbound/client/render/EngineeringMonumentRenderer.java
          ! grep -q 'box(out, pose, 0.34, 2.25, 0.34, 0.66, 2.72, 0.66' src/main/java/dev/futurae/veilbound/client/render/EngineeringMonumentRenderer.java
          echo VEILBOUND_0156_SOURCE_AUDIT=PASS

      - name: Package reconstructed 0.1.56 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat "$GITHUB_WORKSPACE/.veilbound-0156-root")"
          tar -C "$ROOT" -cJf "$GITHUB_WORKSPACE/Veilbound-0.1.56-dev-source.tar.xz" \
            --exclude='./build' \
            --exclude='./.gradle' \
            --exclude='./.vanilla' \
            --exclude='./run' \
            .
          test -s "$GITHUB_WORKSPACE/Veilbound-0.1.56-dev-source.tar.xz"

      - name: Java 25 Gradle build and packaged JAR audit
        shell: bash
        run: |
          exec > >(tee "$GITHUB_WORKSPACE/03-gradle-build.log") 2>&1
          set -euo pipefail
          ROOT="$(cat "$GITHUB_WORKSPACE/.veilbound-0156-root")"
          cd "$ROOT"
          java -version
          gradle --version
          gradle --no-daemon --stacktrace clean check jar
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$GITHUB_WORKSPACE/Veilbound-0.1.56-dev.jar"
          cd "$GITHUB_WORKSPACE"
          unzip -t Veilbound-0.1.56-dev.jar
          unzip -Z1 Veilbound-0.1.56-dev.jar | grep -q 'dev/futurae/veilbound/client/render/VeilLanceRenderer.class'
          unzip -Z1 Veilbound-0.1.56-dev.jar | grep -q 'dev/futurae/veilbound/block/VeilLanceBlock.class'
          unzip -Z1 Veilbound-0.1.56-dev.jar | grep -q 'dev/futurae/veilbound/block/entity/VeilLanceBlockEntity.class'
          unzip -Z1 Veilbound-0.1.56-dev.jar | grep -q 'dev/futurae/veilbound/client/render/EngineeringMonumentRenderer.class'
          unzip -Z1 Veilbound-0.1.56-dev.jar | grep -q 'assets/veilbound/textures/block/threshold_frame.png.mcmeta'
          RECIPES="$(unzip -Z1 Veilbound-0.1.56-dev.jar | grep -c '^data/veilbound/veilbound/engineering_recipes/.*\.json$')"
          test "$RECIPES" -eq 120
          echo "VEILBOUND_0156_JAR_AUDIT=PASS recipes=$RECIPES threshold_animation=present" | tee "$GITHUB_WORKSPACE/Veilbound-0.1.56-dev-audit.txt"

      - name: Exact-JAR NeoForge 26.2.0.75 server smoke
        shell: bash
        run: |
          exec > >(tee "$GITHUB_WORKSPACE/04-server-setup.log") 2>&1
          set -euo pipefail
          SERVER="$GITHUB_WORKSPACE/server-0156"
          LOG="$GITHUB_WORKSPACE/Veilbound-0.1.56-dev-server-smoke.log"
          mkdir -p "$SERVER/mods"
          cd "$SERVER"
          curl -fsSL -o neoforge-installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/26.2.0.75/neoforge-26.2.0.75-installer.jar
          java -jar neoforge-installer.jar --installServer
          echo 'eula=true' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          server-port=25565
          motd=Veilbound CI smoke
          EOF
          cp "$GITHUB_WORKSPACE/Veilbound-0.1.56-dev.jar" mods/

          # run.sh launches Java as a child. Put the complete launcher tree in its
          # own process group so successful readiness can be observed and then cleaned up.
          setsid bash run.sh nogui > "$LOG" 2>&1 &
          SERVER_PID=$!
          SMOKE_OK=0
          for _ in $(seq 1 180); do
            if grep -Eq 'Done \([0-9.]+s\)!' "$LOG"; then
              SMOKE_OK=1
              break
            fi
            if grep -Eq 'ModLoadingException|Exception in thread "main"|Crash report|Failed to start the minecraft server|Encountered an unexpected exception' "$LOG"; then
              break
            fi
            sleep 1
          done

          # Preserve the readiness result before cleanup. Cleanup is strictly best-effort.
          SMOKE_STATUS=1
          if [ "$SMOKE_OK" -eq 1 ]; then
            SMOKE_STATUS=0
          fi
          kill -TERM -- -"$SERVER_PID" 2>/dev/null || true
          for _ in $(seq 1 10); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill -KILL -- -"$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

          if [ "$SMOKE_STATUS" -ne 0 ]; then
            echo 'VEILBOUND_0156_SERVER_SMOKE=FAIL'
            tail -n 200 "$LOG" || true
            exit 1
          fi
          grep -E 'Done \([0-9.]+s\)!' "$LOG"
          ! grep -E 'ModLoadingException|Exception in thread "main"|Crash report|Failed to start the minecraft server|Encountered an unexpected exception' "$LOG"
          echo 'VEILBOUND_0156_SERVER_SMOKE=PASS'
          cd "$GITHUB_WORKSPACE"
          sha256sum Veilbound-0.1.56-dev.jar Veilbound-0.1.56-dev-source.tar.xz Veilbound-0.1.56-dev-server-smoke.log > Veilbound-0.1.56-dev-SHA256SUMS.txt

      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.56-dev-diagnostics
          path: |
            03-gradle-build.log
            04-server-setup.log
            Veilbound-0.1.56-dev.jar
            Veilbound-0.1.56-dev-source.tar.xz
            Veilbound-0.1.56-dev-audit.txt
            Veilbound-0.1.56-dev-SHA256SUMS.txt
            Veilbound-0.1.56-dev-server-smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload validated final artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.56-dev-final
          path: |
            Veilbound-0.1.56-dev.jar
            Veilbound-0.1.56-dev-source.tar.xz
            Veilbound-0.1.56-dev-audit.txt
            Veilbound-0.1.56-dev-SHA256SUMS.txt
            Veilbound-0.1.56-dev-server-smoke.log
          if-no-files-found: error
          retention-days: 30