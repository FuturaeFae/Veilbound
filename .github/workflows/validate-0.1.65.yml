name: Validate Veilbound 0.1.65

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-0165:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Download exact validated 0.1.64 source baseline
        uses: actions/download-artifact@v4
        with:
          name: Veilbound-0.1.64-dev-final
          path: baseline-0164
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34116138329

      - name: Reconstruct 0.1.65 terminal redesign
        shell: bash
        run: |
          set -euo pipefail
          echo "da347e2243e47af944167241b874b560be21625d623f53af0e99f6c31631f507  baseline-0164/Veilbound-0.1.64-dev-source.tar.xz" | sha256sum -c -
          test -s ci-0165/apply-0165.py
          test "$(find ci-0165/fragments -maxdepth 1 -type f | wc -l)" -eq 12
          mkdir -p source-0165
          tar -xJf baseline-0164/Veilbound-0.1.64-dev-source.tar.xz -C source-0165
          python3 ci-0165/apply-0165.py source-0165

      - name: Audit Domain terminal source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=source-0165
          grep -q '^mod_version=0.1.65-dev$' "$ROOT/gradle.properties"
          grep -q 'PROTOCOL = "19"' "$ROOT/src/main/java/dev/futurae/veilbound/platform/neoforge/network/NeoForgeNetworking.java"
          grep -q 'GRID_ROWS = 9' "$ROOT/src/main/java/dev/futurae/veilbound/client/screen/VeilInventoryScreen.java"
          grep -q 'DEPOSIT_RESOURCE_STACK' "$ROOT/src/main/java/dev/futurae/veilbound/network/VeilInventoryActionPayload.java"
          grep -q 'CRAFT_MAX' "$ROOT/src/main/java/dev/futurae/veilbound/network/VeilCraftingRequestPayload.java"
          grep -q 'PLAYER_STORAGE_SLOTS = 36' "$ROOT/src/main/java/dev/futurae/veilbound/platform/neoforge/inventory/NeoForgeVeilCraftingController.java"
          grep -q 'Matter patterns are identities backed by the shared Matter pool' "$ROOT/src/main/java/dev/futurae/veilbound/client/screen/VeilInventoryScreen.java"
          grep -q 'return VeilStorageCapacity.EFFECTIVELY_UNLIMITED' "$ROOT/src/main/java/dev/futurae/veilbound/inventory/VeilStoragePolicy.java"
          grep -q 'a bound Domain immediately unlocks its Veil Inventory' "$ROOT/src/test/java/dev/futurae/veilbound/inventory/VeilInventorySelfTest.java"
          ! grep -R -q 'VeilStoragePolicy.RESONANT' "$ROOT/src/test/java/dev/futurae/veilbound/inventory"
          ! grep -q 'veil_transmutation_locked' "$ROOT/src/main/java/dev/futurae/veilbound/matter/MatterTransmutationService.java"
          ! grep -q 'hasFeature(DomainFeature.VEIL_CRAFTING)' "$ROOT/src/main/java/dev/futurae/veilbound/inventory/VeilCraftingService.java"
          python3 - <<'PY'
          import json
          from pathlib import Path
          lang=json.loads(Path('source-0165/src/main/resources/assets/veilbound/lang/en_us.json').read_text())
          assert lang['screen.veilbound.veil_inventory.player_inventory'] == 'Inventory'
          assert len(list(Path('source-0165/src/main/resources/data/veilbound/veilbound/engineering_recipes').glob('*.json'))) == 120
          print('VEILBOUND_0165_SOURCE_AUDIT=PASS terminal_grid=81 player_inventory=36 matter=intrinsic crafting=intrinsic')
          PY

      - name: Package 0.1.65 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -C source-0165 -cJf Veilbound-0.1.65-dev-source.tar.xz --exclude='./build' --exclude='./.gradle' --exclude='./run' .
          test -s Veilbound-0.1.65-dev-source.tar.xz

      - name: Java 25 Gradle build and packaged JAR audit
        shell: bash
        run: |
          exec > >(tee "$GITHUB_WORKSPACE/03-gradle-build-0165.log") 2>&1
          set -euo pipefail
          cd source-0165
          gradle --no-daemon --stacktrace clean check jar
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$GITHUB_WORKSPACE/Veilbound-0.1.65-dev.jar"
          cd "$GITHUB_WORKSPACE"
          unzip -t Veilbound-0.1.65-dev.jar
          unzip -Z1 Veilbound-0.1.65-dev.jar | grep -q 'dev/futurae/veilbound/client/screen/VeilInventoryScreen.class'
          unzip -Z1 Veilbound-0.1.65-dev.jar | grep -q 'dev/futurae/veilbound/platform/neoforge/inventory/NeoForgeVeilInventoryController.class'
          unzip -Z1 Veilbound-0.1.65-dev.jar | grep -q 'dev/futurae/veilbound/platform/neoforge/inventory/NeoForgeVeilCraftingController.class'
          RECIPES="$(unzip -Z1 Veilbound-0.1.65-dev.jar | grep -c '^data/veilbound/veilbound/engineering_recipes/.*\.json$')"
          test "$RECIPES" -eq 120
          echo "VEILBOUND_0165_JAR_AUDIT=PASS terminal=domain_unlocked grid=81 player_inventory=36 crafting=max_stack recipes=$RECIPES" | tee Veilbound-0.1.65-dev-audit.txt

      - name: Exact-JAR NeoForge 26.2.0.75 server smoke
        shell: bash
        run: |
          exec > >(tee "$GITHUB_WORKSPACE/04-server-setup-0165.log") 2>&1
          set -euo pipefail
          SERVER="$GITHUB_WORKSPACE/server-0165"
          LOG="$GITHUB_WORKSPACE/Veilbound-0.1.65-dev-server-smoke.log"
          mkdir -p "$SERVER/mods"
          cd "$SERVER"
          curl -fsSL -o neoforge-installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/26.2.0.75/neoforge-26.2.0.75-installer.jar
          java -jar neoforge-installer.jar --installServer
          echo 'eula=true' > eula.txt
          printf 'online-mode=false\nserver-port=25565\nmotd=Veilbound 0.1.65 CI smoke\n' > server.properties
          cp "$GITHUB_WORKSPACE/Veilbound-0.1.65-dev.jar" mods/
          setsid bash run.sh nogui > "$LOG" 2>&1 &
          SERVER_PID=$!
          SMOKE_OK=0
          for _ in $(seq 1 180); do
            if grep -Eq 'Done \([0-9.]+s\)!' "$LOG"; then SMOKE_OK=1; break; fi
            if grep -Eq 'ModLoadingException|Exception in thread "main"|Crash report|Failed to start the minecraft server|Encountered an unexpected exception' "$LOG"; then break; fi
            sleep 1
          done
          kill -TERM -- -"$SERVER_PID" 2>/dev/null || true
          sleep 2
          kill -KILL -- -"$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          if [ "$SMOKE_OK" -ne 1 ]; then tail -n 200 "$LOG" || true; exit 1; fi
          grep -E 'Done \([0-9.]+s\)!' "$LOG"
          echo VEILBOUND_0165_SERVER_SMOKE=PASS
          cd "$GITHUB_WORKSPACE"
          sha256sum Veilbound-0.1.65-dev.jar Veilbound-0.1.65-dev-source.tar.xz Veilbound-0.1.65-dev-server-smoke.log > Veilbound-0.1.65-dev-SHA256SUMS.txt

      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.65-dev-diagnostics
          path: |
            03-gradle-build-0165.log
            04-server-setup-0165.log
            Veilbound-0.1.65-dev.jar
            Veilbound-0.1.65-dev-source.tar.xz
            Veilbound-0.1.65-dev-audit.txt
            Veilbound-0.1.65-dev-SHA256SUMS.txt
            Veilbound-0.1.65-dev-server-smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload validated final artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Veilbound-0.1.65-dev-final
          path: |
            Veilbound-0.1.65-dev.jar
            Veilbound-0.1.65-dev-source.tar.xz
            Veilbound-0.1.65-dev-audit.txt
            Veilbound-0.1.65-dev-SHA256SUMS.txt
            Veilbound-0.1.65-dev-server-smoke.log
          if-no-files-found: error
          retention-days: 30
